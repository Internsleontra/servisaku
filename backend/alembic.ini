[alembic]
script_location = migrations
prepend_sys_path = .

# This is overridden by env.py to use the async DATABASE_URL from .env
# Overridden by env.py at runtime — this fallback is for CLI reference only
sqlalchemy.url = postgresql+asyncpg://postgres:admin@localhost:5432/servisaku

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
