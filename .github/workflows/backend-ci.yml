name: Backend CI

# Scoped to backend/ only — does not touch the Express/Prisma backend, the
# web frontend, or either mobile app's own build pipelines.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  import-check:
    name: Install & import/startup validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import/startup validation
        # No live database is needed for this — SQLAlchemy's
        # create_async_engine() is lazy and never connects at import time
        # (see database.py); this only proves the app object itself, every
        # router, and every model build cleanly.
        env:
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
          JWT_SECRET_KEY: ci-placeholder-secret-not-used-for-real-auth
        run: |
          python -c "import main; print(f'OK - {len(main.app.routes)} routes registered')"

  test-and-coverage:
    name: Test suite + 80% coverage gate
    runs-on: ubuntu-latest
    needs: import-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify DATABASE_URL secret is configured
        # This test suite runs against a real, already-seeded PostgreSQL
        # database (custom enum types, PostGIS, generated columns, RBAC/
        # catalog seed data) — see docs/TESTING_GUIDE.md. There is no
        # separate test database, by deliberate project decision, so this
        # job needs read/write access to a real Postgres instance with that
        # schema already present (the team's shared dev DB, or an
        # equivalently seeded instance). Fails loudly here rather than
        # silently skipping, so a missing secret is never mistaken for a
        # passing test run.
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "::error::DATABASE_URL repository secret is not configured. This job needs a real, already-seeded PostgreSQL connection string (see backend/docs/TESTING_GUIDE.md and backend/docs/ENVIRONMENT_SETUP.md). If the database is only reachable via an SSH bastion (as in local dev), also configure the SSH_HOST/SSH_USER/SSH_PRIVATE_KEY/DB_HOST secrets referenced below so this job can open the same tunnel local development uses."
            exit 1
          fi

      - name: Open SSH tunnel to the database (only if SSH secrets are configured)
        if: ${{ secrets.SSH_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ci_tunnel_key
          chmod 600 ~/.ssh/ci_tunnel_key
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              -i ~/.ssh/ci_tunnel_key -f -N \
              -L "${{ secrets.SSH_LOCAL_PORT || '15433' }}:${{ secrets.DB_HOST }}:5432" \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          sleep 3

      - name: Start the app server (for the Socket.IO test suite)
        # tests/test_socketio.py needs a real HTTP-reachable server —
        # python-socketio's client speaks the Engine.IO transport, not ASGI
        # in-process (see that file's own docstring). Every other test file
        # runs in-process against main.app via httpx's ASGITransport and
        # doesn't need this.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-not-for-production' }}
          RATE_LIMIT_ENABLED: "false"
        run: |
          nohup python -m uvicorn main:socket_app --host 127.0.0.1 --port 8000 > uvicorn_ci.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Server is up"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health || (cat uvicorn_ci.log && exit 1)

      - name: Run pytest with coverage (fails if statement coverage < 80%)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'ci-test-secret-not-for-production' }}
          SOCKETIO_TEST_URL: http://127.0.0.1:8000
        run: |
          python -m pytest tests/ -q \
            --cov=. --cov-config=.coveragerc --cov-report=term-missing \
            --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/.coverage
          retention-days: 14
