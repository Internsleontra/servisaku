# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint — STAGING API + database.
#
# Why the API is not on Netlify/Vercel: server/index.js runs a long-lived HTTP
# server with Socket.IO for real-time notifications. Both platforms are
# serverless and cannot hold a WebSocket open, which is why netlify.toml proxies
# /api/* and /socket.io/* to a separate host. This blueprint is that host.
#
# Creates two resources:
#   servisaku-api    Node web service (Express + Prisma)
#   servisaku-db     PostgreSQL
#
# Deploy: Render dashboard → New → Blueprint → pick this repo and branch.
#
# SECRETS ARE NOT IN THIS FILE. JWT_SECRET is generated by Render;
# DATABASE_URL is wired from the database resource. Everything with
# `sync: false` is left blank for a human to fill in the dashboard — payment,
# SMS and email credentials never belong in version control.
#
# STAGING ONLY. Payment providers are intentionally unset, so checkout runs in
# its unavailable state rather than against live credentials. Do not paste
# production Billplz/Stripe keys into this environment.
# ─────────────────────────────────────────────────────────────────────────────
databases:
  - name: servisaku-db
    databaseName: servisaku
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: servisaku-api
    runtime: node
    plan: free
    region: singapore          # closest region to the Malaysian user base
    branch: feat/partner-wallet-cash-commission
    healthCheckPath: /api/health
    # `migrate deploy` applies the 30 committed migrations and never generates
    # new ones — safe to run on every boot. Seeding is deliberately NOT here:
    # it is a one-off, run from the Render shell once the service is up.
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: servisaku-db
          property: connectionString
      # Generated by Render — never seen by a human or committed anywhere.
      # server/index.js refuses to boot if this is under 16 characters.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated. Fill in with the two Netlify site URLs once they exist;
      # the browser will be blocked by CORS until this matches them exactly.
      - key: CORS_ORIGIN
        sync: false
      - key: APP_WEB_BASE_URL
        sync: false
      - key: APP_PUBLIC_BASE_URL
        sync: false
      # The expiry worker cancels bookings, voids escrow and issues refunds.
      # It stays off in staging: seeded data has past-dated bookings that would
      # otherwise be swept on the first tick.
      - key: UNASSIGNED_EXPIRY_ENABLED
        value: "false"
      # Keeps SMS in log-only mode so no real messages are sent from staging.
      - key: SMS_DEV_MODE
        value: "true"
      # ── Optional integrations ────────────────────────────────────────────
      # Every one of these degrades gracefully when unset: payments report the
      # method as unavailable, email/SMS no-op, the chatbot reports itself as
      # not ready. Set them in the dashboard only if that surface is being
      # tested, and only ever with sandbox credentials.
      - key: BILLPLZ_API_KEY
        sync: false
      - key: BILLPLZ_COLLECTION_ID
        sync: false
      - key: BILLPLZ_X_SIGNATURE_KEY
        sync: false
      - key: BILLPLZ_BASE_URL
        value: https://www.billplz-sandbox.com/api
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
